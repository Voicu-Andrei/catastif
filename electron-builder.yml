appId: ro.catastif.app
productName: Catastif
copyright: Copyright © 2026 Catastif

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

# Native deps rebuilt for Electron via electron-builder
npmRebuild: true

win:
  target:
    - nsis
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  # Instalare pe utilizator: actualizările nu cer drepturi de administrator.
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Datele utilizatorului (baza SQLite, atașamentele, setările) stau în
  # %APPDATA%\catastif, în afara folderului de instalare. `false` aici este ce
  # garantează că o actualizare — care înseamnă dezinstalare + instalare — nu le
  # atinge. Nu schimba în `true`: ar șterge toată evidența firmei la update.
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.business
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office

# Update feed: GitHub Releases (public repo). electron-updater reads this.
#
# `releaseType: release` NU este opțional. Implicit, electron-builder publică un
# release în stare de ciornă (electron-publish/gitHubPublisher: `options.draft
# === false ? "release" : "draft"`), iar ciornele nu apar nici în /releases/latest,
# nici în releases.atom — exact sursele din care electron-updater află că există
# o versiune nouă. Cu ciornă, actualizarea automată nu pornește niciodată, în
# tăcere, oricât de corect ar fi restul.
publish:
  provider: github
  owner: Voicu-Andrei
  repo: catastif
  releaseType: release
