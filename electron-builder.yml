appId: ro.catastif.app
productName: Catastif
copyright: Copyright © 2026 Catastif

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**

# Native deps rebuilt for Electron via electron-builder
npmRebuild: true

win:
  target:
    - nsis
  # Nume FĂRĂ versiune, intenționat: astfel linkul „ultima versiune” de pe
  # GitHub rămâne mereu același și poate fi dat o singură dată utilizatorului:
  # https://github.com/Voicu-Andrei/catastif/releases/latest/download/Catastif-Setup.exe
  artifactName: ${productName}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.business
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office

# Update feed: GitHub Releases (public repo). electron-updater reads this.
publish:
  provider: github
  owner: voicu-andrei
  repo: catastif
  # OBLIGATORIU. Implicit electron-builder creează un release „draft”, adică
  # invizibil public: linkul .../releases/latest/download/... ar da 404, iar
  # actualizarea automată nu ar găsi nimic, până când cineva apasă manual
  # „Publish release” pe GitHub. Cu „release” lansarea e publică direct.
  releaseType: release
