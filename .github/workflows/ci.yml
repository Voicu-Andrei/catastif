name: CI

# Verificări la fiecare push și PR: tipuri, lint, format, teste.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Verifică tipurile
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verifică formatarea
        run: npm run format:check

      - name: Rulează testele
        run: npm test
