name: CI

# Verificări la fiecare push și PR: tipuri, lint, format, teste.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifica:
    # Aplicația rulează în principal pe Windows, așa că verificăm și acolo:
    # căile, sfârșiturile de linie și modulele native se comportă diferit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Verifică tipurile
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verifică formatarea
        run: npm run format:check

      # `npm test` rulează întâi `pretest`, care recompilează better-sqlite3
      # pentru Node (postinstall îl compilase pentru Electron — alt ABI).
      - name: Rulează testele
        run: npm test
