name: Release

# Construiește instalatoarele și le publică pe pagina Releases.
#
# Două căi de pornire:
#  - un tag „v*” împins (calea obișnuită): git tag v0.1.0 && git push origin v0.1.0
#  - pornire manuală din fila Actions („Run workflow”), utilă când tagul nu poate
#    fi împins. electron-builder creează oricum release-ul și tagul din `version`
#    din package.json, deci rezultatul este identic.

on:
  push:
    tags:
      - 'v*'
      # Și tagurile scrise fără „v” (0.5.0). Ele NU vor trece de verificarea de
      # mai jos — dar asta e tocmai ideea: un tag greșit trebuie să eșueze
      # zgomotos, cu un mesaj care spune ce să corectezi. Înainte, un tag fără
      # „v” nu declanșa absolut nimic: niciun build, nicio eroare, doar tăcere,
      # iar `releases/latest` rămânea un release gol care strica descărcarea și
      # actualizarea automată pentru toți.
      - '[0-9]*'
  # Permite pornirea manuală din tab-ul Actions, fără terminal. (Butonul „Run
  # workflow” apare doar dacă acest fișier există și pe branch-ul implicit.)
  workflow_dispatch:

permissions:
  contents: write

# Deocamdată se publică DOAR instalatorul de Windows.
# macOS este scos intenționat: build-ul ar fi complet nesemnat, iar macOS
# refuză să pornească o aplicație nesemnată pe procesoarele Apple (M1–M4) —
# utilizatorul ar descărca un fișier care nu se deschide. Se readaugă
# `macos-latest` în matrice după ce rezolvăm semnarea.
jobs:
  # electron-builder derivă tagul release-ului din `version` din package.json, NU
  # din tagul împins. Dacă cele două diferă, artefactele ajung pe alt tag decât
  # cel care a pornit build-ul, iar aplicațiile instalate nu văd niciodată
  # actualizarea. Verificăm o singură dată, înainte de orice build.
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      # Doar la pornirea prin tag: la pornirea manuală nu există tag de comparat,
      # iar tagul release-ului îl scrie electron-builder din package.json.
      - name: Tagul trebuie să corespundă versiunii din package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          versiune="v$(node -p "require('./package.json').version")"
          if [ "$versiune" != "$GITHUB_REF_NAME" ]; then
            echo "Tagul împins ($GITHUB_REF_NAME) nu corespunde versiunii din package.json ($versiune)."
            case "$GITHUB_REF_NAME" in
              [0-9]*)
                echo ""
                echo "Tagul nu începe cu litera «v». Numele corect este: $versiune"
                echo "Șterge release-ul și tagul «$GITHUB_REF_NAME», apoi refă-l ca «$versiune»."
                ;;
              *)
                echo "Actualizează 'version' în package.json, apoi refă tagul."
                ;;
            esac
            exit 1
          fi
          echo "Versiune confirmată: $versiune"

      - name: Verifică tipurile
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Rulează testele
        run: npm test

  release:
    needs: verifica
    strategy:
      fail-fast: false
      # Rulăm secvențial: ambele sisteme publică pe același tag, iar dacă pornesc
      # în paralel fiecare poate crea propriul release pentru acel tag, lăsând
      # instalatorul Windows și latest.yml pe unul, iar macOS pe celălalt.
      max-parallel: 1
      # `ubuntu-latest` produce AppImage-ul pe care electron-builder.yml îl
      # declară — altfel configurația promitea un artefact care nu exista.
      matrix:
        # macOS rămâne EXCLUS: build-ul ar fi complet nesemnat, iar macOS refuză
        # să pornească o aplicație nesemnată pe procesoarele Apple — utilizatorul
        # ar descărca un fișier care nu se deschide. Se readaugă după semnare.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalează dependențele
        run: npm ci

      - name: Compilează (electron-vite)
        run: npm run build

      - name: Construiește și publică instalatoarele
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1 este nesemnat — nu încerca semnarea pe macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
